<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wayfinder</title><style>
body{margin:0;background:#f3f6f2;color:#26352c;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;height:100vh;background:white;display:flex;flex-direction:column}header{padding:18px 25px;border-bottom:1px solid #e5ebe5;display:flex;align-items:center;gap:10px}.logo{font-size:20px;font-weight:800}.logo b{color:#287451}.content{padding:24px;overflow:auto;flex:1}.welcome{max-width:650px;margin:30px auto}.welcome h2{font-size:28px}.muted{color:#77847a;font-size:13px}.messages{max-width:700px;margin:auto;display:grid;gap:12px}.msg{padding:12px 15px;border-radius:13px;max-width:85%;line-height:1.5}.user{justify-self:end;background:#287451;color:white;white-space:pre-wrap}.bot{background:#eff4ef;justify-self:start}
.bot p{margin:0 0 10px}.bot p:last-child{margin-bottom:0}.bot ul,.bot ol{margin:4px 0 10px;padding-left:22px}.bot li{margin:2px 0}.bot strong{font-weight:700}.bot em{font-style:italic}.bot a{color:#1e5c3f;text-decoration:underline}.bot code{background:#dde8df;padding:1px 6px;border-radius:5px;font-size:13px;font-family:ui-monospace,Menlo,monospace}.bot pre{background:#dde8df;padding:10px 12px;border-radius:8px;overflow-x:auto;margin:0 0 10px}.bot pre code{background:none;padding:0}.bot h1,.bot h2,.bot h3{margin:4px 0 8px;font-size:1.05em}.bot hr{border:0;border-top:1px solid #cdd9ce;margin:10px 0}.bot table{border-collapse:collapse;margin:0 0 10px}.bot th,.bot td{border:1px solid #cdd9ce;padding:4px 8px;text-align:left}.composer{border-top:1px solid #e5ebe5;padding:14px 22px}.upload{font-size:12px;color:#287451;cursor:pointer;margin-bottom:10px;display:block}.entry{display:flex;gap:10px}.entry textarea{flex:1;border:1px solid #dce5dc;border-radius:12px;padding:12px;font:inherit}.send{background:#287451;color:white;border:0;border-radius:10px;padding:11px 18px;cursor:pointer}@media(max-width:650px){.content{padding:15px}}
.gate{position:fixed;inset:0;background:rgba(20,30,24,.55);display:none;align-items:center;justify-content:center;z-index:50}.gate.show{display:flex}.gate-card{background:white;border-radius:16px;padding:28px;width:320px;max-width:90vw}.gate-card h2{margin:0 0 6px;font-size:20px}.gate-card p{color:#77847a;font-size:13px;margin:0 0 18px}.gate-row{display:flex;gap:8px;margin-bottom:12px}.gate-row select{border:1px solid #dce5dc;border-radius:10px;padding:10px;font:inherit}.gate-row input{flex:1;border:1px solid #dce5dc;border-radius:10px;padding:10px;font:inherit}.gate-card button{width:100%;background:#287451;color:white;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer}.gate-error{color:#c0392b;font-size:12px;margin-top:8px;min-height:16px}
.activity{background:#f7faf7;border:1px solid #dce8dd;justify-self:stretch;max-width:100%;padding:14px 16px}.activity-head{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}.activity-list{display:grid;gap:8px}.activity-stage{display:flex;align-items:flex-start;gap:9px;color:#748178;font-size:13px}.activity-stage .stage-icon{width:17px;flex:none;text-align:center}.activity-stage.done{color:#287451}.activity-stage.active{color:#26352c;font-weight:600}.activity-stage.attention{color:#93631a}.activity-stage.failed{color:#b33b32}.activity-stage .stage-detail{display:block;color:#77847a;font-weight:400;font-size:12px;margin-top:2px}.activity-foot{border-top:1px solid #e1e9e1;margin-top:10px;padding-top:8px;color:#77847a;font-size:11px}.typing{display:flex;gap:4px;padding:4px 2px}.typing span{width:7px;height:7px;border-radius:50%;background:#9aab9e;animation:bounce 1.1s infinite ease-in-out}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
</head><body>
<div class="gate" id="gate"><div class="gate-card"><h2>Welcome to Wayfinder</h2><p>Enter your phone number to get started - it's how Wayfinder links your trip across every channel.</p><div class="gate-row"><select id="gcc"></select><input id="gdigits" placeholder="Phone number" inputmode="numeric"></div><button id="gsubmit">Continue</button><div class="gate-error" id="gerror"></div></div></div><div class="app"><header><div class="logo">way<b>finder</b></div></header><div class="content"><div class="welcome" id="welcome"><h2>Where would you like to go?</h2><p class="muted">Tell Wayfinder what your family has in mind, or upload a bank statement.</p></div><div id="messages" class="messages"></div></div><div class="composer" id="composer"><label class="upload">＋ Upload bank statement (PDF) or trip photos <input id="file" type="file" accept=".pdf,image/jpeg,image/png,image/heic" multiple hidden></label><div class="entry"><textarea id="message" placeholder="Message Wayfinder…"></textarea><button class="send" id="send">Send</button></div><p class="muted" id="status">PDF or photo, up to 15 MB each</p></div></div><script>
const $=x=>document.getElementById(x);let sid=localStorage.getItem("wayfinder.session");if(!sid){sid=crypto.randomUUID();localStorage.setItem("wayfinder.session",sid)}const h={"Content-Type":"application/json","X-Wayfinder-Session":sid};
const COUNTRY_CODES=[["+91","India (+91)"],["+1","US/Canada (+1)"],["+44","UK (+44)"],["+971","UAE (+971)"],["+65","Singapore (+65)"],["+61","Australia (+61)"],["+49","Germany (+49)"],["+33","France (+33)"],["+81","Japan (+81)"],["+86","China (+86)"],["+94","Sri Lanka (+94)"],["+60","Malaysia (+60)"],["+852","Hong Kong (+852)"],["+966","Saudi Arabia (+966)"],["+974","Qatar (+974)"]];
$("gcc").innerHTML=COUNTRY_CODES.map(([c,l])=>'<option value="'+c+'">'+l+'</option>').join("");
async function ensurePhone(){try{let r=await fetch("/api/identity",{headers:h}),d=await r.json();if(!d.confirmed){$("gate").classList.add("show")}else{$("gate").classList.remove("show")}}catch(e){$("gate").classList.add("show")}}
$("gsubmit").onclick=async()=>{let digits=$("gdigits").value.replace(/\D/g,"");if(!digits){$("gerror").textContent="Enter your phone number.";return}$("gsubmit").disabled=true;$("gerror").textContent="";try{let r=await fetch("/api/register-phone",{method:"POST",headers:h,body:JSON.stringify({country_code:$("gcc").value,phone_digits:digits})}),d=await r.json();if(!r.ok)throw Error(d.error);$("gate").classList.remove("show")}catch(e){$("gerror").textContent=e.message}finally{$("gsubmit").disabled=false}};
ensurePhone();
marked.setOptions({breaks:true});
function add(role,t){let e=document.createElement("div");e.className="msg "+role;if(role==="bot"){e.innerHTML=DOMPurify.sanitize(marked.parse(t))}else{e.textContent=t}$("messages").appendChild(e);$("welcome").style.display="none";e.scrollIntoView({block:"end"});return e}
function showTyping(){let e=document.createElement("div");e.className="msg bot typing-wrap";e.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';e.id="typing-indicator";$("messages").appendChild(e);$("welcome").style.display="none";e.scrollIntoView({block:"end"});return e}
function hideTyping(){let e=$("typing-indicator");if(e)e.remove()}
const STAGES=[["UNDERSTANDING","Understanding your trip"],["DISCOVERY","Discovering destinations and experiences"],["AFFORDABILITY","Reviewing travel affordability"],["TRANSPORT","Researching flights"],["ACCOMMODATION","Comparing accommodation"],["FINALIZING","Preparing your recommendations"]];
function createActivity(){let e=document.createElement("div");e.className="msg bot activity";let head=document.createElement("div");head.className="activity-head";head.textContent="✦ Wayfinder is planning your trip";e.appendChild(head);let list=document.createElement("div");list.className="activity-list";for(const [key,label] of STAGES){let row=document.createElement("div");row.className="activity-stage";row.dataset.stage=key;let icon=document.createElement("span");icon.className="stage-icon";icon.textContent="○";let body=document.createElement("div");body.textContent=label;row.append(icon,body);list.appendChild(row)}e.appendChild(list);let foot=document.createElement("div");foot.className="activity-foot";foot.textContent="Live planning updates · Progress summary, not internal reasoning.";e.appendChild(foot);$("messages").appendChild(e);$("welcome").style.display="none";e.scrollIntoView({block:"end"});return e}
function updateActivity(activity,event){let row=activity.querySelector('[data-stage="'+event.stage+'"]');if(!row)return;row.classList.remove("done","active","attention","failed");const status=event.status||"";if(status==="COMPLETED"){row.classList.add("done");row.querySelector(".stage-icon").textContent="✓"}else if(status==="IN_PROGRESS"){row.classList.add("active");row.querySelector(".stage-icon").textContent="◌"}else if(status==="NEEDS_ATTENTION"){row.classList.add("attention");row.querySelector(".stage-icon").textContent="!"}else if(status==="FAILED"){row.classList.add("failed");row.querySelector(".stage-icon").textContent="×"}let detail=row.querySelector(".stage-detail");if(!detail){detail=document.createElement("span");detail.className="stage-detail";row.querySelector("div").appendChild(detail)}detail.textContent=event.message||"";activity.scrollIntoView({block:"end"})}
async function send(){let m=$("message").value.trim();if(!m)return;$("message").value="";$("send").disabled=true;add("user",m);let activity=createActivity(),finalReply=null;try{let r=await fetch("/api/chat/stream",{method:"POST",headers:h,body:JSON.stringify({message:m})});if(!r.ok){let d=await r.json();throw Error(d.error||"Request failed")}const reader=r.body.getReader(),decoder=new TextDecoder();let buffer="";while(true){const {value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let blocks=buffer.split("\n\n");buffer=blocks.pop();for(const block of blocks){const line=block.split("\n").find(x=>x.startsWith("data: "));if(!line)continue;const event=JSON.parse(line.slice(6));if(event.type==="stage_update"){updateActivity(activity,event)}else if(event.type==="final"){finalReply=event.reply}else if(event.type==="error"){throw Error(event.error)}}}if(buffer.trim()){const line=buffer.split("\n").find(x=>x.startsWith("data: "));if(line){const event=JSON.parse(line.slice(6));if(event.type==="final")finalReply=event.reply;else if(event.type==="error")throw Error(event.error)}}activity.remove();if(finalReply)add("bot",finalReply);else add("bot","Wayfinder finished without a response. Please try again.")}catch(e){activity.remove();add("bot","Wayfinder error: "+e.message)}finally{$("send").disabled=false}}$("send").onclick=send;$("message").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
async function uploadOne(f){$("status").textContent="Processing "+f.name+"…";showTyping();let fd=new FormData();fd.append("file",f);try{let r=await fetch("/api/upload",{method:"POST",headers:{"X-Wayfinder-Session":sid},body:fd}),d=await r.json();hideTyping();if(!r.ok)throw Error(d.error);if(d.kind==="photo"){add("bot","Photo received: "+d.filename+"\n\n"+d.caption)}else{add("bot","Statement processed: "+d.filename+"\n\n"+d.summary)}$("status").textContent=d.filename+" processed"}catch(x){hideTyping();$("status").textContent=x.message;add("bot","Upload failed: "+x.message)}}
$("file").onchange=async e=>{let files=[...e.target.files];if(!files.length)return;for(const f of files){await uploadOne(f)}e.target.value=""};
</script></body></html>
